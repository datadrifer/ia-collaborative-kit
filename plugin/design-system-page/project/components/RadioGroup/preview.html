<div id="root" class="p-inset-lg font-sans text-foreground"></div>
<script>
(function () {
  var h = React.createElement
  var ns = window.IACollaborative
  with (ns) {
    ReactDOM.createRoot(document.getElementById('root')).render(h(RadioGroup,{defaultValue:'classic'}, ...[['classic','Classic'],['agentic','Agentic'],['machine','Machine']].map(([v,l])=>h('div',{key:v,className:'flex items-center gap-inset-xs'}, h(RadioGroupItem,{value:v,id:'r'+v}), h(Label,{htmlFor:'r'+v},l)))))
  }
})()
</script>
