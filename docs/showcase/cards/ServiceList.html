<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../lib/card.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script>
  // Open overlays focus themselves; without this the showcase page scrolls to the card.
  const focus = HTMLElement.prototype.focus;
  HTMLElement.prototype.focus = function (options) { focus.call(this, { ...options, preventScroll: true }); };
  // Inside the showcase, a card never scrolls the page around it (an open Select scrolls its item into view).
  if (window !== window.parent) Element.prototype.scrollIntoView = function () {};
</script>
<script src="../lib/react.production.min.js"></script>
<script src="../lib/react-dom.production.min.js"></script>
<script src="../lib/bundle.js"></script>
<title>Numbered service list</title>
</head>
<body>
<div data-theme="light" class="min-h-screen bg-background p-inset-lg font-sans text-foreground">
<div class="max-w-xl">
  <ol class="service-list">
    <li class="service-list-selected">
      <span class="service-list-label"><span class="service-list-number-on">01.</span><span>Behavioral Insight &amp; Intent Intelligence</span></span>
      <span class="service-list-chevron-on">›</span>
    </li>
    <li class="service-list-item">
      <span class="service-list-label"><span class="service-list-number">02.</span><span>Enterprise Data &amp; AI Strategy</span></span>
      <span class="service-list-chevron">›</span>
    </li>
    <li class="service-list-item">
      <span class="service-list-label"><span class="service-list-number">03.</span><span>Experience &amp; Product</span></span>
      <span class="service-list-chevron">›</span>
    </li>
    <li class="service-list-item">
      <span class="service-list-label"><span class="service-list-number">04.</span><span>Operating Model Transformation</span></span>
      <span class="service-list-chevron">›</span>
    </li>
  </ol>
</div>
</div>

</body>
</html>
