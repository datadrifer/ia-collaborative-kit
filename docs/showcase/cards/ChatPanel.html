<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../lib/card.css">
<link rel="stylesheet" href="../lib/bundle.css">
<script>
  // Open overlays focus themselves; without this the showcase page scrolls to the card.
  const focus = HTMLElement.prototype.focus;
  HTMLElement.prototype.focus = function (options) { focus.call(this, { ...options, preventScroll: true }); };
  // Inside the showcase, a card never scrolls the page around it (an open Select scrolls its item into view).
  if (window !== window.parent) Element.prototype.scrollIntoView = function () {};
</script>
<script src="../lib/react.production.min.js"></script>
<script src="../lib/react-dom.production.min.js"></script>
<script src="../lib/bundle.js"></script>
<title>Conversational panel</title>
</head>
<body>
<div data-theme="light" class="min-h-screen bg-background p-inset-lg font-sans text-foreground">
<div class="max-w-2xl">
  <section class="chat-panel">
    <div class="chat-panel-message">
      <div class="chat-panel-avatar"></div>
      <div>
        <p class="chat-panel-name">Hey there, how's it going?</p>
        <p class="chat-panel-text">Welcome to IA Collaborative. I can help shape a tailored path from strategy to shipped outcomes. What challenge are you trying to solve right now?</p>
      </div>
    </div>
    <div class="chat-panel-input">
      <span class="chat-panel-field">Ask IA Collaborative...</span>
      <button class="chat-panel-send" type="button">↑</button>
    </div>
  </section>
</div>
</div>

</body>
</html>
